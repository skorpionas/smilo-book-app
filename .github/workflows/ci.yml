name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm check:i18n
      # Run time-zone sensitive tests in two host zones (risk R1)
      - run: TZ=Europe/Vilnius pnpm test:coverage
      - run: TZ=America/New_York pnpm test

  db-and-e2e:
    name: DB tests (pgTAP) + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start local Supabase (migrations + seed)
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,storage-api

      - name: pgTAP tests
        run: pnpm exec supabase test db

      - name: Generated types compile against the schema
        run: |
          pnpm exec supabase gen types typescript --local > lib/supabase/database.types.ts
          pnpm typecheck

      - name: Export local Supabase env
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|ANON_KEY)=')"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"

      - name: Smoke - seed owner can log in via Supabase Auth
        run: |
          curl -sS -X POST "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" \
            -d '{"email":"owner@smilo.local","password":"smilo-dev-password"}' \
            | jq -r 'if .access_token then "OK: logged in as \(.user.email)" else "FAIL: \(.)" end'
          echo "URL=$NEXT_PUBLIC_SUPABASE_URL keyprefix=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:0:15}"

      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
