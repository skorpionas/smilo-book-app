name: DB migrations

# dev:  every push to main applies new migrations to the dev project (previews use it)
# prod: manual run, gated by the "production" environment (required reviewer)
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:
    inputs:
      target:
        description: Which database
        type: choice
        options: [dev, production]
        default: dev

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'dev' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Show pending migrations
        run: pnpm exec supabase migration list
      # Never pushes seed data: seed.sql is for local / CI only.
      - run: pnpm exec supabase db push
