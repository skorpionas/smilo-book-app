name: UI screenshots

# On demand: add the label "ui-screens" to a PR (or run it by hand on a branch).
# Renders every main screen against the seeded local stack on iPhone, iPad
# (portrait + landscape) and desktop, and commits them to `docs/screenshots/`
# on that same branch, so they are reviewable in the PR's "Files changed".
# Never touches a hosted database.
#
# - JPEG at CSS pixel size keeps one full set at a few MB.
# - The bot commit does not start a Vercel build (vercel.json `ignoreCommand`
#   skips commits that only touch docs/screenshots/) and is not uploaded with
#   other deployments (.vercelignore).
# - Pushes made with GITHUB_TOKEN start no workflows, so CI is dispatched for
#   the new head commit explicitly; the label is removed so it can be re-added.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: ui-screens-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  screens:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ui-screens'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (migrations + seed)
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,storage-api
      - name: Export local Supabase env
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|ANON_KEY)=')"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture
        run: pnpm exec playwright test screens.spec.ts --reporter=list
        env:
          CI: "true"
          SCREENSHOTS: "1"
      - name: Commit to docs/screenshots
        run: |
          set -euo pipefail
          rm -rf docs/screenshots
          mkdir -p docs/screenshots
          cp -r screenshots/* docs/screenshots/
          {
            echo "# UI screenshots"
            echo
            echo "Generated by \`.github/workflows/ui-screens.yml\` from \`tests/e2e/screens.spec.ts\`"
            echo "(seed data, local stack) for \`$BRANCH\` @ \`${GITHUB_SHA::7}\`. Re-run: add the \`ui-screens\` label to the PR."
            for dev in mobile tablet-portrait tablet-landscape desktop; do
              [ -d "docs/screenshots/$dev" ] || continue
              echo; echo "## $dev"; echo
              for f in docs/screenshots/$dev/*.jpg; do
                n="$(basename "$f" .jpg)"
                echo "- [$n]($dev/$n.jpg)"
              done
            done
          } > docs/screenshots/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/screenshots
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -qm "docs: UI screenshots for $BRANCH"
          git push -q origin "HEAD:$BRANCH"
      - name: Run CI on the new commit and clear the label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref "$BRANCH"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/ui-screens" || true
          fi
